[project]
name = "mitre-mcp-server"
version = "0.1.6"
description = "MCP server providing access to MITRE ATT&CK threat intelligence framework"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Inoussa Mouiche", email = "mouiche@uwindsor.ca" }
]
license = { text = "Apache-2.0" }
keywords = ["mitre", "attack", "mcp", "threat-intelligence", "cybersecurity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Upper bound is load-bearing. mcp 2.0 renamed FastMCP to MCPServer and
    # removed mcp.server.fastmcp, which server.py imports. Without "<2" a
    # fresh install resolves mcp 2.x and fails at import. Drop this bound only
    # together with migrating server.py to `from mcp.server.mcpserver import
    # MCPServer`.
    "mcp>=1.1.0,<2",
    "stix2>=3.0.0",
    "mitreattack-python>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mitre-mcp-server = "mitre_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repository carries a checked-in copy of the ATT&CK STIX bundles under
# src/mitre_mcp_server/data/v18.1/ (56MB). Nothing reads it: the server
# resolves its data directory from MITRE_MCP_DATA_DIR or
# ~/.mitre-mcp-server/data and downloads the release that
# mitreattack-python reports as current, now v20.1. Shipping it made the wheel
# 9.6MB, 97% of which was dead and stale. Excluding it takes the wheel under
# 100KB; first run downloads the current data as it always did.
[tool.hatch.build.targets.wheel]
packages = ["src/mitre_mcp_server"]
exclude = ["data/v*"]

# Tests are developer tooling, not something users of the package need. They
# are also script-style rather than a pytest suite, so they execute on import
# and are of no use to a downstream packager.
[tool.hatch.build.targets.sdist]
exclude = [
    "src/mitre_mcp_server/data/v*",
    "tests",
    "test_parser_quick.py",
    "temp-config.json",
    ".github",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
