name: Release to npm

# Publishes to npm using trusted publishing (OIDC). There is no NPM_TOKEN and
# no one-time password: GitHub Actions proves the workflow's identity to npm
# directly, so releases need neither a stored secret nor an interactive
# terminal.
#
# npm is removing direct-publish capability from 2FA-bypass granular access
# tokens in January 2027, which is why this uses OIDC rather than a token.
#
# One-time setup on npmjs.com, under the package's Settings -> Trusted
# Publisher:
#   Publisher:  GitHub Actions
#   Owner:      imouiche
#   Repository: complete-mitre-attack-mcp-server
#   Workflow:   release.yml
#   Environment: (leave blank)
# An unvalidated trusted-publisher configuration expires 48 hours after it is
# created, so push a tag within that window.
#
# To release:
#   git tag v0.1.5 && git push origin v0.1.5
# Or run this workflow manually from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: lets Actions mint the OIDC token npm verifies

jobs:
  release:
    runs-on: ubuntu-latest # trusted publishing does not support self-hosted runners

    # Declared at job level as well as workflow level. The first attempt was
    # granted only "Contents: read, Metadata: read" despite the workflow-level
    # block, leaving npm with no OIDC token to exchange.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      # setup-node v6 performs the OIDC handshake. v4 and v5 do not support
      # trusted publishing.
      #
      # registry-url is set, as npm's documented example does, so npm knows
      # which registry to run the OIDC exchange against. The catch is that
      # setup-node also writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # into a temporary .npmrc and defaults NODE_AUTH_TOKEN to the literal
      # placeholder XXXXX-XXXXX-XXXXX-XXXXX. npm then publishes with that
      # placeholder rather than exchanging the OIDC token, and the registry
      # answers 404. The credential line is stripped below.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # Reports which credential this run can use. OIDC needs id-token: write
      # plus a matching trusted-publisher entry on npmjs.com; NPM_TOKEN is the
      # fallback. Informational: if neither is usable the publish step fails
      # with npm's own message, which is clearer than a guess made here.
      - name: Report the available publish credential
        id: creds
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN secret is set; publishing with it."
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "No NPM_TOKEN; will attempt trusted publishing (OIDC)."
            echo "This needs a Trusted Publisher entry on npmjs.com naming"
            echo "  owner=${GITHUB_REPOSITORY%%/*} repo=${GITHUB_REPOSITORY#*/} workflow=release.yml"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither NPM_TOKEN nor an OIDC token is available; publish will fail."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # setup-node writes an .npmrc containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and defaults NODE_AUTH_TOKEN to the literal placeholder
      # XXXXX-XXXXX-XXXXX-XXXXX. With a real NPM_TOKEN that line is what
      # authenticates the publish, so it must stay. Without one it has to go,
      # or npm sends the placeholder instead of running the OIDC exchange and
      # the registry answers 404.
      - name: Remove the placeholder credential when using OIDC
        if: steps.creds.outputs.has_token == 'false'
        run: |
          RC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$RC" ]; then
            sed -i '/_authToken/d' "$RC"
            echo "stripped the placeholder; npm will use OIDC"
          fi

      - name: Check run.js parses
        run: node --check run.js

      - name: Check the three manifests agree on one version
        run: |
          PKG=$(node -p "require('./package.json').version")
          PY=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          SRV=$(node -p "require('./server.json').version")
          SRVPKG=$(node -p "require('./server.json').packages.map(p=>p.version).join(',')")
          echo "package.json=$PKG pyproject=$PY server.json=$SRV packages=$SRVPKG"
          for v in "$PY" "$SRV" "$SRVPKG"; do
            if [ "$v" != "$PKG" ]; then
              echo "::error::Version mismatch. package.json is $PKG but found $v."
              exit 1
            fi
          done

      # Guards against tagging v0.1.6 while package.json still says 0.1.5.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            exit 1
          fi

      # Already-published is a normal state, not an error: re-running a tag, or
      # publishing by hand and then pushing the tag, both land here. Record it
      # and skip the publish rather than failing the run, so a red result always
      # means something is actually wrong.
      - name: Is this version already on npm?
        id: published
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$PKG is already on npm; verification will run, publish will be skipped."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$PKG is unpublished."
          fi

      # The npm package ships the Python source but not its dependencies, so
      # run.js provisions them at runtime. Verify the shipped source imports
      # under the pinned dependency set before publishing it.
      - name: Verify the packaged Python source
        run: |
          # Write the declared specifiers to a requirements file rather than
          # interpolating them into the command line: they contain '<' and ',',
          # and command substitution does not strip quotes, so an inline
          # $(...) would hand the shell a redirect.
          python3 - <<'PY'
          import tomllib, pathlib
          with open("pyproject.toml", "rb") as f:
              deps = tomllib.load(f)["project"]["dependencies"]
          pathlib.Path("/tmp/reqs.txt").write_text("\n".join(deps) + "\n")
          print("installing:", ", ".join(deps))
          PY
          python3 -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet --upgrade pip
          /tmp/verify/bin/pip install --quiet -r /tmp/reqs.txt
          /tmp/verify/bin/python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

          # Verify the PACKED tarball, not the repo tree. package.json files[]
          # excludes modules the server does not need, so checking src/ would
          # pass even if an entry wrongly excluded something required. This runs
          # against exactly the bytes users receive.
          npm pack --silent >/dev/null
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          tar xzf ./*.tgz -C /tmp/pkg --strip-components=1
          echo "packed modules:"
          find /tmp/pkg/src -name '*.py' | sed 's|/tmp/pkg/||' | sort | sed 's/^/  /'
          PYTHONPATH=/tmp/pkg/src /tmp/verify/bin/python - <<'PY'
          import asyncio
          from mitre_mcp_server.server import mcp
          tools = asyncio.run(mcp.list_tools())
          assert tools, "no tools registered"
          missing = [t.name for t in tools if not (t.description or "").strip()]
          assert not missing, f"tools without descriptions: {missing}"
          print(f"{len(tools)} tools registered, all with descriptions")
          PY

      # The tool count is advertised in the README tagline, a badge, a section
      # heading and a per-area table. Checking it against the registered tools
      # rather than hardcoding a number here means adding a tool fails the
      # release until the README is updated, instead of quietly making the
      # headline figure wrong.
      - name: Check the README tool counts match the code
        run: PYTHONPATH=src /tmp/verify/bin/python scripts/check_tool_counts.py

      - name: Show what would be published
        run: npm publish --dry-run --access public

      # Publishing needs a credential this workflow does not always have.
      # Trusted publishing (OIDC) requires a matching entry under the package's
      # Settings -> Trusted Publisher on npmjs.com; without it the token
      # exchange answers 404 "package not found". NPM_TOKEN is the fallback for
      # repositories that have a granular token in Actions secrets.
      #
      # Verbose logging so a failure names the cause rather than just
      # "need auth".
      - name: Publish
        if: steps.published.outputs.already == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --loglevel verbose

      - name: Already released
        if: steps.published.outputs.already == 'true'
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          {
            echo "### Verified, nothing to publish"
            echo
            echo "\`$NAME@$PKG\` is already on npm, so every check ran against"
            echo "the released artifact and the publish step was skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm
        if: steps.published.outputs.already == 'false'
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          sleep 10
          echo "npm now reports: $(npm view "$NAME" version)"
          echo "Published $NAME@$PKG" >> "$GITHUB_STEP_SUMMARY"
